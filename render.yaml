databases:
  - name: smartcollege-db
    plan: free
    region: singapore

services:
  - type: web
    name: smartcollege-erp
    autoDeploy: true
    runtime: python
    region: singapore
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: smartcollege-db
          property: connectionString
