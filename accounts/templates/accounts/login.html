{% extends "base_auth.html" %}

{% block title %}Sign in{% endblock %}

{% block card %}
    <h1>Welcome back</h1>
    <p class="lead">Sign in to your Smart College account.</p>

    {% if error %}
        <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" autocomplete="on">
        {% csrf_token %}

        <div class="field">
            <label for="username">Username</label>
            <input class="input" id="username" name="username" type="text" autocomplete="username" autofocus required placeholder="Enter your username">
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password" required placeholder="Enter your password">
        </div>

        <button class="btn btn-primary btn-block" type="submit" style="margin-top:20px;padding:12px">Sign in</button>
    </form>

    <div class="auth-foot">
        New student or faculty? <a href="/accounts/register/"><b>Create an account</b></a>
    </div>
{% endblock %}
