{% if page.paginator.num_pages > 1 %}
<div class="pagination">
    <div class="muted">Showing {{ page.start_index }}–{{ page.end_index }} of {{ page.paginator.count }}</div>
    <div class="pages">
        {% if page.has_previous %}<a class="page-btn" href="?{{ page_base }}&page={{ page.previous_page_number }}">‹ Prev</a>{% else %}<span class="page-btn disabled">‹ Prev</span>{% endif %}
        <span class="page-btn active">{{ page.number }} / {{ page.paginator.num_pages }}</span>
        {% if page.has_next %}<a class="page-btn" href="?{{ page_base }}&page={{ page.next_page_number }}">Next ›</a>{% else %}<span class="page-btn disabled">Next ›</span>{% endif %}
    </div>
</div>
{% endif %}
